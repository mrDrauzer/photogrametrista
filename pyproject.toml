[project]
name = "photogrametrista"
version = "0.1.0"
description = "Система фотограмметрической обработки данных"
authors = [
    {name = "Admin"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "yadisk (>=3.4.0,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "django-leaflet (>=0.33.0,<0.34.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "dj-database-url (>=3.1.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "django-prometheus (>=2.4.1,<3.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=25.2,<26.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "exif (>=1.6.1,<2.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "requests (>=2.32.5,<3.0.0)",
    "djangorestframework-gis (>=1.2.0,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)"
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "photogrametrista.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=core --cov=photogrametrista --cov-report=term-missing"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["**/migrations/*.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
